# SwipeX — Local/Dev Integration Environment (Milestone 1)
# Brings up PostgreSQL, Redis, and all three backend services + the Gateway
# on one bridge network. Deployment to a real cloud target is explicitly
# out of scope until after Milestone 4 (see SRS Section 1.2 / Section 13).

services:

  postgres:
    image: postgres:16-alpine
    container_name: swipex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swipex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swipex_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-swipex_auth}
    ports:
      - "5432:5432"
    volumes:
      - swipex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swipex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swipex-net

  redis:
    image: redis:7-alpine
    container_name: swipex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swipex-net

  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: swipex-auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-swipex}:${POSTGRES_PASSWORD:-swipex_dev_pass}@postgres:5432/${POSTGRES_DB:-swipex_auth}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swipex-net

  job_service:
    build:
      context: .
      dockerfile: services/job_service/Dockerfile
    container_name: swipex-job-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8000"
    networks:
      - swipex-net

  resume_service:
    build:
      context: .
      dockerfile: services/resume_service/Dockerfile
    container_name: swipex-resume-service
    restart: unless-stopped
    env_file: .env
    environment:
      JOB_SERVICE_URL: http://job_service:8000
    ports:
      - "8003:8000"
    depends_on:
      - job_service
    networks:
      - swipex-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: swipex-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth_service:8000
      JOB_SERVICE_URL: http://job_service:8000
      RESUME_SERVICE_URL: http://resume_service:8000
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - job_service
      - resume_service
    networks:
      - swipex-net

volumes:
  swipex_pg_data:

networks:
  swipex-net:
    driver: bridge
